name: Deploy backend (opt-in)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publicar as funções deste commit no Convex de produção
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: convex-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Deploy selected production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo 'Configure CONVEX_DEPLOY_KEY no GitHub Environment production.' >&2
            exit 1
          fi
          npm run deploy --workspace backend
