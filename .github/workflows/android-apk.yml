name: Android APK

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente dos serviços e assinatura
        type: choice
        options: [development, production]
        default: development
        required: true
      version:
        description: Versão do app (ex. 0.1.0)
        type: string
        default: 0.1.0
        required: true
      version_code:
        description: Inteiro maior que o último instalado neste ambiente
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      APP_ENV: ${{ inputs.environment }}
      APP_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run check
      - name: Prepare Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore environment signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const encoded = process.env.ANDROID_KEYSTORE_BASE64;
          if (!encoded?.trim()) throw new Error('Configure ANDROID_KEYSTORE_BASE64 neste GitHub Environment.');
          const path = join(process.env.RUNNER_TEMP, 'babel-crux-signing.jks');
          writeFileSync(path, Buffer.from(encoded, 'base64'), { mode: 0o600 });
          NODE
      - name: Build and verify standalone signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/babel-crux-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: babel-crux-${{ inputs.environment }}-${{ inputs.version }}-${{ inputs.version_code }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/${{ inputs.environment }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove temporary signing key
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          import { join } from 'node:path';
          rmSync(join(process.env.RUNNER_TEMP, 'babel-crux-signing.jks'), { force: true });
          NODE
